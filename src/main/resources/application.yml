spring:
  application:
    name: api-forge

  datasource:
    url: jdbc:h2:mem:apiforge;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: true
      # LAZY 컬렉션을 IN (...) 한 번으로 모아 로드 — 1+N 을 1+1 로 만든다.
      # (Dataset.columns 를 순회하는 카탈로그·관리자 목록에 적용)
      hibernate.default_batch_fetch_size: 100

  sql:
    init:
      mode: embedded

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    user:
      # 데모용 기본값 — 운영 배포 시 환경변수 ADMIN_USER / ADMIN_PASSWORD 로 재정의
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:admin1234}
      roles: ADMIN

apiforge:
  usage:
    # 사용량 카운터를 메모리에 모았다가 주기적으로 반영하는 간격(ms).
    # 0 이하면 버퍼링 없이 요청마다 즉시 기록한다.
    flush-interval-ms: 5000

logging:
  level:
    org.jooq: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info
